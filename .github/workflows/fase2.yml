name: Fase 2 API Docker e integracion
on:
  push:
    branches: [main, fase2-ai-supportassist]
    paths: ['Fase2/**', '.github/workflows/fase2.yml']
  pull_request:
    paths: ['Fase2/**', '.github/workflows/fase2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Fase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Fase2/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=evidence/junit-ci.xml
      - name: Construir contenedor
        run: docker compose build --progress plain
      - name: Ejecutar contenedor
        run: docker compose up -d --wait --wait-timeout 90
      - name: Probar endpoints del contenedor
        run: python -m scripts.smoke --output evidence/container-http.json
      - name: Exportar contrato OpenAPI y estado Docker
        run: |
          curl --fail http://127.0.0.1:8000/openapi.json > evidence/openapi-container.json
          docker compose ps --format json > evidence/docker-state.json
          docker image inspect ai-supportassist:fase2 > evidence/docker-image.json
      - run: python -m playwright install --with-deps chromium
      - name: Comprobar interfaz contra contenedor
        run: python -m scripts.browser_check
      - name: Conservar logs
        if: always()
        run: docker compose logs --no-color > evidence/container-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase2-evidencias-${{ github.run_number }}
          path: Fase2/evidence/
          retention-days: 30
      - name: Detener contenedor
        if: always()
        run: docker compose down
